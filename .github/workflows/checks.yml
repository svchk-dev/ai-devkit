name: AI Devkit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select pinned npm
        run: npm install --global npm@12.2.0 --no-audit --no-fund
      - name: Install locked tooling
        run: make setup
      - name: Run maintained local checks
        run: make check
      - name: Verify independent consumers
        run: make test-consumer
